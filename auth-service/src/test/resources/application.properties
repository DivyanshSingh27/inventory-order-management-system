# Server
server.port=0

# Database - H2 in-memory mode for tests (no local Postgres dependency)
spring.datasource.url=jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application Name
spring.application.name=auth-service

# Token Config (test secret >= 32 bytes)
jwt.secret=testSecretKeyMustBeAtLeast32BytesLongForHS256Validation!
jwt.expiration-ms=1800000
app.token.expiry-hours=24

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
