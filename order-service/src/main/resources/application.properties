# ─────────────────────────────────────────
# APPLICATION
# ─────────────────────────────────────────
spring.application.name=order-service
server.port=${PORT:8082}

# ─────────────────────────────────────────
# POSTGRESQL
# ─────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─────────────────────────────────────────
# JPA / HIBERNATE
# ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─────────────────────────────────────────
# INTER-SERVICE URLS
# Order Service calls these two services
# ─────────────────────────────────────────
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8081}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}

# ─────────────────────────────────────────
# ACTUATOR & HEALTH MONITORING
# ─────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ─────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────
logging.level.com.order=INFO
logging.level.org.hibernate.SQL=DEBUG